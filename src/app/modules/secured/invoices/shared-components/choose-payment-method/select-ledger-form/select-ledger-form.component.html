<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Select Payment Method</mat-label>
    <input
      type="text"
      placeholder="Search for a ledger"
      aria-label="Ledger"
      matInput
      formControlName="ledger"
      [matAutocomplete]="auto"
    >
    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" [displayWith]="displayLedgerTitle">
      @for (ledger of filteredLedgers | async; track ledger.id) {
        <mat-option [value]="ledger.id" [disabled]="isSelected(ledger.id)">
          {{ ledger.title }}
        </mat-option>
      }
      @empty {
        <mat-option disabled>No ledgers found</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount">
  </mat-form-field>
  <button type="submit" class="btn btn-primary w-100" [loading]="loading">
    {{ buttonText }}
  </button>
</form>
