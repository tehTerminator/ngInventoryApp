<form class="card card-body" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="w-100">
      <mat-label>Mobile Number</mat-label>
      <input type="text" matInput #customerTextField formControlName="mobile" maxlength="10" />
    </mat-form-field>
    <button type="submit" class="btn btn-primary w-100">Next</button>
</form>
