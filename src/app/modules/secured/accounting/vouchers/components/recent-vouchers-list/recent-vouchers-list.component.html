<table class="table shadow" [loading]="loading">
  <thead>
    <tr>
      <th>#</th>
      <th>Date</th>
      <th>Description</th>
      <th>Amount</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let voucher of vouchers | async">
      <td>
        {{ voucher.id }}
      </td>
      <td>
        {{ voucher.created_at | date : "dd-MMM-YY" }}
      </td>
      <td>
        {{ voucher.creditor.title }} > {{ voucher.debtor.title }}
        <br />
        {{ voucher.narration }}
      </td>
      <td>
        {{ voucher.amount | currency : "INR" }}
      </td>
    </tr>
  </tbody>
</table>
