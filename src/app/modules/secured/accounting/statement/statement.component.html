<div class="row g-3 d-flex justify-content-center">
    <div class="col-xl-2 col-md-3" [ngClass]="rowCount > 0 ? 'col-xl-2 col-md-3' : 'col-xl-4 col-md-6'">
        <app-form></app-form>
    </div>
    @if (rowCount > 0) {
        <div class="col-xl-10 col-md-9" *ngIf="rowCount > 0;">
            <app-table></app-table>
        </div>
        
    }
</div>

@if (rowCount > 0) {
    <div class="row">
        <div class="col-xl-2 col-md-3">
                <app-balance-form></app-balance-form>
            </div>
    </div>
}

@if (rowCount <= 0) {
    <div class="row d-flex justify-content-center">
        <div class="col-xl-4 col-md-6">
            <div class="text-center border border-1">No Data</div>
        </div>
    </div>
}
